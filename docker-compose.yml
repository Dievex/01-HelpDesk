services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173" # Vite (UI, dev)
      - "3000:3000" # Express (API)
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  # Con nombre, no bind-mounts a rutas del host: `docker compose up` se comporta
  # igual en las dos PCs sin depender de dónde esté clonado el repo en cada una.
  db-data:
  uploads:
  # Volumen anónimo-con-nombre para node_modules: evita que el bind-mount de arriba
  # (`.:/app`) tape los node_modules instalados dentro de la imagen.
  app-node-modules:
