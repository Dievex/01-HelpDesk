services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173" # Vite (UI, dev)
      - "3000:3000" # Express (API)
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

# Volúmenes con nombre (portabilidad entre PCs): docs/03-fase-construccion/decisiones-tecnicas.md
volumes:
  db-data:
  uploads:
  # Si `npm run dev` da "not found" tras cambiar un package.json, este volumen
  # quedó desactualizado -- arreglo:
  #   docker compose down && docker volume rm 01-helpdesk_app-node-modules && docker compose up --build
  app-node-modules:
